        /* Modern ve Gelişmiş Arkaplan Tasarımı */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1a1a2e, #121212);
            background-size: 400% 400%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
            animation: gradientBG 15s ease infinite;
        }

        /* Saf CSS ile Oluşturulmuş Siberpunk Devre Kartı Dokusu */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                repeating-linear-gradient(45deg, rgba(0, 255, 136, 0.03) 0px, rgba(0, 255, 136, 0.03) 1px, transparent 1px, transparent 10px),
                repeating-linear-gradient(-45deg, rgba(0, 255, 255, 0.03) 0px, rgba(0, 255, 255, 0.03) 1px, transparent 1px, transparent 10px);
            background-size: 20px 20px;
            opacity: 0.8;
            z-index: 0;
            animation: techDrift 20s linear infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes techDrift {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        /* Üst ve Alt Yazı Tasarımları (Terminal/Hacker Tarzı) */
        .header-text {
            position: absolute;
            top: 30px;
            color: rgba(0, 255, 136, 0.8);
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            z-index: 2;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            pointer-events: none; /* Tıklamayı engeller */
        }

        .footer-text {
            position: absolute;
            bottom: 20px;
            color: rgba(0, 255, 136, 0.5);
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;

            z-index: 2;
            pointer-events: none;
        }

        /* Neon Buton Tasarımı */

            color: #121212;
            padding: 22px 60px;
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 14px;
            border: 2px solid #00ff88;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.7), 0 0 50px rgba(0, 255, 136, 0.5);
            transition: all 0.3s ease-in-out;
            cursor: pointer;
            letter-spacing: 4px;
            position: relative;
            z-index: 1;
        }

        .launch-btn:hover {

            color: #00ff88;
            border-color: #00ff88;

        }

        .launch-btn:active {

            box-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
        }
